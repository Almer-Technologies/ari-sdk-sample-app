# Builds the sample app and runs its unit tests.
#
# WHAT THIS CATCHES: a sample that no longer compiles against the SDK AAR, a
# test that no longer passes, and a tool declaration the build cannot produce —
# the Ari Gradle plugin runs DemoTools in a plain JVM to write
# assets/ari_tools.json, so a declaration that calls an Android framework method,
# or grows past the 64 KB cap, fails :app:assembleDebug here.
#
# WHAT THIS DOES NOT CATCH: upstream SDK changes breaking a partner. The SDK is
# consumed as a binary from sdk-repo/, the Maven repository committed in this
# repo, and nothing here rebuilds it from leviathan. So a green run proves the
# sample works against THE AAR THAT IS COMMITTED — the exact artifact a partner
# gets — and says nothing about leviathan's current source. Upstream can move
# under this sample and every run stays green until someone republishes the AAR
# (sdk-repo/BUILT_FROM.txt says how). Nothing here compiles the SDK's own
# sources or runs the SDK's own tests: they are not in this repo.
#
# WHAT NOTHING HERE COVERS: the device. No emulator, no headset. The
# permission gate is a no-op under the android unit-test jar, and the deeplink
# half of the sample stops at the manifest: CircleDeeplinkTest proves the
# filter is DECLARED to match the uri show_circle declares, not that Android
# resolves it. See "Verified on hardware" in the README.
#
# RUNNER: ubuntu-latest, a hosted runner. This build needs a JDK and an Android
# SDK and nothing else — no signing keys, no emulator, no Xcode, no
# submodules, and no network repository beyond google() + mavenCentral() plus
# the committed sdk-repo/. The hosted Ubuntu image ships an Android SDK with
# its licences accepted, so AGP can fetch any platform or build-tools it is
# missing — including android-36, which the SDK AAR's metadata requires
# consumers to compile against. leviathan runs on self-hosted macOS ARM64
# runners because it is a large monorepo with iOS targets, release signing and
# warm caches; none of that applies to a one-module sample, and a hosted runner
# keeps this repo forkable by a partner.
#
# JDK 21, pinned rather than inherited. AGP 9.1.0 needs 17 or newer, no module
# declares a toolchain, so whatever JDK Gradle runs on is the one that compiles
# the code. 21 is what the README tells a partner to use and what this was
# verified against locally.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # local.properties is gitignored, so there is no sdk.dir here. The build
      # finds the SDK through ANDROID_HOME, which the hosted image sets.
      - name: Report the toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      # :app is the only module. Resolving the SDK *and the Gradle plugin* from
      # sdk-repo/ is part of what this proves: a run that could not find the AAR,
      # or found it without its POM, or could not resolve the plugin marker under
      # pluginManagement, fails here rather than at a partner's first launch.
      - name: Build and test
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest

      # The committed asset is gone, so this diffs the shipped bytes against the
      # plugin's own output instead. What it guards is the wiring: the plugin
      # writes into build/, and only addGeneratedSourceDirectory puts that folder
      # in front of mergeAssets. If the link broke, the build stays green and the
      # APK ships no declaration at all — unzip fails here instead. Comparing
      # bytes rather than a list of names keeps the tool names in one place.
      - name: Check the declaration ships inside the APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/ari_tools.json > /tmp/ari_tools_from_apk.json
          diff app/build/generated/assets/generateDebugAriTools/ari_tools.json \
            /tmp/ari_tools_from_apk.json
          echo "the APK ships the declaration the plugin generated"

      # A separate check, because the diff above cannot see this one. Measured:
      # with an asset committed at src/main/assets AND the plugin generating one,
      # the generated copy wins the merge and the build stays green — so a stale
      # committed file is invisible in the APK and simply misleads whoever reads
      # the source tree. Nothing generates that path any more; nothing may.
      - name: Check no declaration asset is committed
        run: |
          if git ls-files -- '**/assets/ari_tools.json' | grep -q .; then
            echo "ari_tools.json is committed — the plugin generates it" >&2
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
