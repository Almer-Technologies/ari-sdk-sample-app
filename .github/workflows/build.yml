# Builds the sample app and runs its unit tests.
#
# WHAT THIS CATCHES: a sample that no longer compiles against the SDK AAR, a
# test that no longer passes, and a declaration asset someone edited by hand or
# forgot to regenerate — because :app:testDebugUnitTest includes the drift check
# that compares assets/ari_tools.json to AriToolService's registry.
#
# WHAT THIS DOES NOT CATCH: upstream SDK changes breaking a partner. The SDK is
# consumed as a binary from sdk-repo/, the Maven repository committed in this
# repo, and nothing here rebuilds it from leviathan. So a green run proves the
# sample works against THE AAR THAT IS COMMITTED — the exact artifact a partner
# gets — and says nothing about leviathan's current source. Upstream can move
# under this sample and every run stays green until someone republishes the AAR
# (sdk-repo/BUILT_FROM.txt says how). Nothing here compiles the SDK's own
# sources or runs the SDK's own tests: they are not in this repo.
#
# WHAT NOTHING HERE COVERS: the device. No emulator, no headset. The
# permission gate is a no-op under the android unit-test jar and a launch
# result cannot report PendingIntent.isImmutable there, so neither is
# exercised. See "Verified on hardware" in the README.
#
# RUNNER: ubuntu-latest, a hosted runner. This build needs a JDK and an Android
# SDK and nothing else — no signing keys, no emulator, no Xcode, no
# submodules, and no network repository beyond google() + mavenCentral() plus
# the committed sdk-repo/. The hosted Ubuntu image ships an Android SDK with
# its licences accepted, so AGP can fetch any platform or build-tools it is
# missing — including android-36, which the SDK AAR's metadata requires
# consumers to compile against. leviathan runs on self-hosted macOS ARM64
# runners because it is a large monorepo with iOS targets, release signing and
# warm caches; none of that applies to a one-module sample, and a hosted runner
# keeps this repo forkable by a partner.
#
# JDK 21, pinned rather than inherited. AGP 9.1.0 needs 17 or newer, no module
# declares a toolchain, so whatever JDK Gradle runs on is the one that compiles
# the code. 21 is what the README tells a partner to use and what this was
# verified against locally.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # local.properties is gitignored, so there is no sdk.dir here. The build
      # finds the SDK through ANDROID_HOME, which the hosted image sets.
      - name: Report the toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      # :app is the only module. Resolving the SDK from sdk-repo/ is part of
      # what this proves: a run that could not find the AAR, or found it
      # without its POM, fails here rather than at a partner's first launch.
      - name: Build and test
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest

      # The asset is what Ari reads out of the installed APK, so prove it is in
      # there and matches the committed source. The drift test already ties the
      # source to the code; this ties the shipped bytes to the source.
      - name: Check the declaration ships inside the APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/ari_tools.json > /tmp/ari_tools_from_apk.json
          diff app/src/main/assets/ari_tools.json /tmp/ari_tools_from_apk.json
          echo "assets/ari_tools.json in the APK matches the committed declaration"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
