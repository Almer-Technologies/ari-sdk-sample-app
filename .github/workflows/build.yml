# Checks this repository, builds the sample app and runs its unit tests.
#
# The Ari App Tools SDK and its Gradle plugin (com.ari-os, 0.1.1) resolve from
# Maven Central, so every step runs on every push and nothing is gated.
#
# WHAT THE CHECK CATCHES: assets/ari_tools.json must stay generated rather than
# committed. Measured, with an asset committed at src/main/assets AND the plugin
# generating one, the generated copy wins the merge and the build stays green —
# so a stale committed file is invisible in the APK and simply misleads whoever
# reads the source tree.
#
# WHAT THE BUILD CATCHES: a sample that no longer compiles against the SDK AAR,
# a test that no longer passes, and a tool declaration the build cannot
# produce — the Ari Gradle plugin runs DemoTools in a plain JVM to write
# assets/ari_tools.json, so a declaration that calls an Android framework method,
# or grows past the 64 KB cap, fails :app:assembleDebug there.
#
# WHAT IT DOES NOT CATCH: upstream SDK changes breaking a partner. The SDK is
# consumed as a released binary, and nothing here rebuilds it from its own
# sources. So a green run proves the sample works against THE RELEASED 0.1.1
# ARTIFACTS — the exact ones a partner gets — and says nothing about the Ari OS
# platform build's current source. Nothing here compiles the SDK's own sources or
# runs the SDK's own tests: they are not in this repository.
#
# WHAT NOTHING HERE COVERS: the device. No emulator, no hardware. The
# permission gate is a no-op under the android unit-test jar, and the deeplink
# half of the sample stops short of a device: CircleDeeplinkTest proves the
# filter is DECLARED to match the uri show_circle declares, and MainActivityTest
# resolves that uri through Robolectric's package manager and checks the
# screen's banner. Neither is Android on a device. See "Verified on hardware"
# in the README.
#
# RUNNER: ubuntu-latest, a hosted runner. This build needs a JDK and an Android
# SDK and nothing else — no signing keys, no emulator, no Xcode, no
# submodules, and no network repository beyond google() + mavenCentral(). The
# hosted Ubuntu image ships an Android SDK with its licences accepted, so AGP can
# fetch any platform or build-tools it is missing — including android-36, which
# the SDK AAR's metadata requires consumers to compile against. A hosted runner
# also keeps this repo forkable by a partner, which a self-hosted one would not.
#
# JDK 21, pinned rather than inherited. AGP 9.1.0 needs 17 or newer, no module
# declares a toolchain, so whatever JDK Gradle runs on is the one that compiles
# the code. 21 is what the README tells a partner to use and what this was
# verified against locally.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Nothing generates src/main/assets/ari_tools.json, and nothing may: see
      # the header.
      - name: Check no declaration asset is committed
        run: |
          if git ls-files -- '**/assets/ari_tools.json' | grep -q .; then
            echo "ari_tools.json is committed — the plugin generates it" >&2
            exit 1
          fi
          echo "no declaration asset is tracked"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # local.properties is gitignored, so there is no sdk.dir here. The build
      # finds the SDK through ANDROID_HOME, which the hosted image sets.
      - name: Report the toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      # :app is the only module. Resolving the SDK *and the Gradle plugin* from
      # Maven Central is part of what this proves: a run that could not find the
      # AAR, or found it without its POM, or could not resolve the plugin marker
      # under pluginManagement, fails here rather than at a partner's first launch.
      - name: Build and test
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest

      # The asset is generated, so this diffs the shipped bytes against the
      # plugin's own output. What it guards is the wiring: the plugin writes
      # into build/, and only addGeneratedSourceDirectory puts that folder in
      # front of mergeAssets. If the link broke, the build stays green and the
      # APK ships no declaration at all — unzip fails here instead. Comparing
      # bytes rather than a list of names keeps the tool names in one place.
      - name: Check the declaration ships inside the APK
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/ari_tools.json > /tmp/ari_tools_from_apk.json
          diff app/build/generated/assets/generateDebugAriTools/ari_tools.json \
            /tmp/ari_tools_from_apk.json
          echo "the APK ships the declaration the plugin generated"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
